services:
  postgres:
    image: postgres:16-alpine
    container_name: mayorista-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mayorista_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mayorista_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mayorista_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mayorista_erp_postgres_data:
